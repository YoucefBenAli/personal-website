<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#24172f">
  <title>Your Name — terminal portfolio</title>
  <style>
    :root {
      color-scheme: dark;
      --plum: #24172f;
      --plum-deep: #1b1225;
      --ink: #f5ebf4;
      --soft: #c9b9ce;
      --quiet: #9a879f;
      --pink: #efa1bd;
      --peach: #ffc49f;
      --lilac: #c4b5ff;
      --line: rgba(239, 161, 189, .58);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; min-width: 320px; min-height: 100%; margin: 0; }
    body { min-height: 100svh; padding: clamp(10px, 2.2vw, 24px); background: #17101f; color: var(--ink); }
    button, input { color: inherit; font: inherit; }
    button:focus-visible, input:focus-visible { outline: 2px solid var(--peach); outline-offset: 4px; }
    .terminal {
      position: relative;
      isolation: isolate;
      display: flex;
      flex-direction: column;
      width: 100%;
      height: calc(100svh - clamp(20px, 4.4vw, 48px));
      min-height: 400px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 13px;
      background:
        radial-gradient(ellipse at 83% 18%, rgba(137, 91, 155, .12), transparent 29%),
        radial-gradient(ellipse at 12% 100%, rgba(185, 104, 130, .075), transparent 34%),
        var(--plum);
      box-shadow: 0 18px 70px rgba(0, 0, 0, .26), 0 0 28px rgba(219, 130, 173, .06);
    }
    /* A whisper of orbit lines in the wallpaper, not another interface element. */
    .terminal::before {
      position: absolute;
      z-index: 0;
      top: 9%;
      right: 6%;
      width: min(360px, 43vw);
      height: 126px;
      border: 1px solid rgba(196,181,255,.055);
      border-radius: 50%;
      content: "";
      transform: rotate(-24deg);
      box-shadow: 0 0 0 27px rgba(0,0,0,0), 0 0 0 28px rgba(255,196,159,.035);
      pointer-events: none;
    }
    .titlebar {
      position: relative;
      z-index: 1;
      flex: 0 0 39px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 15px;
      border-bottom: 1px solid rgba(239,161,189,.19);
      background: rgba(20, 13, 29, .34);
      color: #d8c8dc;
      font-size: 11px;
    }
    .traffic-lights { display: flex; gap: 6px; }
    .traffic-lights i { display: block; width: 9px; height: 9px; border-radius: 50%; }
    .traffic-lights i:nth-child(1) { background: #f08b98; }
    .traffic-lights i:nth-child(2) { background: #f4c879; }
    .traffic-lights i:nth-child(3) { background: #92c89d; }
    .title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .demo-label { margin-left: auto; color: #987f9e; font-size: 9px; letter-spacing: .07em; white-space: nowrap; }
    .screen {
      position: relative;
      z-index: 1;
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      padding: 20px 22px;
    }
    .transcript {
      flex: 0 0 auto;
      min-height: 0;
      overflow: visible;
      overscroll-behavior: contain;
      scrollbar-color: rgba(239,161,189,.32) transparent;
      scrollbar-width: thin;
      padding: 0 8px 20px 0;
    }
    .identity { margin: 0 0 4px; color: var(--peach); font-size: clamp(14px, 1.8vw, 17px); font-weight: 600; letter-spacing: .015em; }
    .tagline { margin: 0 0 24px; color: var(--soft); font-size: 12px; line-height: 1.7; }
    .welcome { margin: 0 0 18px; color: var(--soft); font-size: 12px; line-height: 1.75; }
    .menu { width: min(100%, 690px); margin: 0 0 21px; }
    .menu-heading { margin: 0 0 8px; color: var(--quiet); font-size: 10px; letter-spacing: .09em; text-transform: uppercase; }
    .command-row {
      width: 100%;
      min-height: 29px;
      display: grid;
      grid-template-columns: max-content minmax(14px, 1fr) max-content;
      align-items: baseline;
      gap: 9px;
      padding: 3px 6px;
      border: 0;
      border-radius: 4px;
      background: transparent;
      cursor: pointer;
      text-align: left;
    }
    .command-row:hover { background: rgba(196,181,255,.085); }
    .command-row:focus-visible { outline-offset: 1px; }
    .command-name { color: var(--pink); font-size: 12px; }
    .leader { align-self: center; min-width: 10px; height: 1px; background-image: radial-gradient(circle, rgba(196,181,255,.48) 1px, transparent 1.25px); background-position: left center; background-size: 5px 2px; }
    .command-description { color: #b3a1ba; font-size: 11px; }
    .output-line { margin: 0 0 6px; color: var(--soft); font-size: 12px; line-height: 1.7; overflow-wrap: anywhere; white-space: pre-wrap; }
    .output-line.command-echo { margin-top: 14px; color: var(--pink); }
    .output-line.command-echo::before { content: "you@your.dev:~$ "; color: var(--peach); }
    .output-line.output-heading { margin-top: 14px; color: var(--peach); }
    .output-line.output-muted { color: var(--quiet); font-size: 10px; }
    .prompt-form {
      flex: 0 0 auto;
      display: flex;
      align-items: baseline;
      gap: 9px;
      min-height: 38px;
      padding-top: 10px;
      border-top: 0;
      font-size: 12px;
    }
    .prompt-label { color: var(--peach); white-space: nowrap; }
    .prompt-input { flex: 1; min-width: 0; padding: 0; border: 0; border-radius: 0; color: var(--ink); background: transparent; caret-color: var(--pink); font: inherit; }
    .prompt-input::placeholder { color: #87758f; opacity: 1; }
    .prompt-input:focus-visible { outline: none; }
    .prompt-form:focus-within .prompt-label { color: #ffd0b7; }
    .cursor { display: inline-block; width: 7px; height: 14px; margin-left: -8px; background: var(--pink); opacity: .8; pointer-events: none; animation: blink 1.15s step-end infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @media (max-width: 520px) {
      body { padding: 8px; }
      .terminal { height: calc(100svh - 16px); min-height: 360px; border-radius: 10px; }
      .titlebar { flex-basis: 36px; padding: 0 11px; gap: 9px; }
      .title { font-size: 10px; }
      .demo-label { font-size: 8px; letter-spacing: 0; }
      .screen { padding: 23px 16px 14px; }
      .tagline { margin-bottom: 20px; }
      .command-row { grid-template-columns: max-content minmax(8px, 1fr) minmax(0, 1.4fr); gap: 6px; padding-inline: 4px; }
      .command-name { font-size: 11px; }
      .command-description { font-size: 10px; }
      .prompt-form { gap: 7px; font-size: 11px; }
      .prompt-label { font-size: 10px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="terminal" aria-label="Your Name's terminal portfolio">
    <header class="titlebar">
      <span class="traffic-lights" aria-hidden="true"><i></i><i></i><i></i></span>
      <span class="title">your.dev — zsh</span>
      <span class="demo-label">SAMPLE / EDIT ME</span>
    </header>
    <section class="screen" aria-label="Interactive portfolio terminal">
      <div class="transcript" id="transcript" role="log" aria-live="polite" aria-relevant="additions text">
        <p class="identity">Your Name</p>
        <p class="tagline">[your role] · making thoughtful things for the web.</p>
        <p class="welcome">A small portfolio, running in a terminal.<br>Type <span class="command-name">help</span> or choose a command:</p>
        <div class="menu" id="help-menu" aria-label="Available commands"></div>
        <p class="output-line output-muted">Tip: use ↑ / ↓ to revisit commands.</p>
      </div>
      <form class="prompt-form" id="command-form" autocomplete="off">
        <label class="prompt-label" for="command-input">you@your.dev:~$</label>
        <input class="prompt-input" id="command-input" name="command" type="text" aria-label="Type a portfolio command" placeholder="type help…" spellcheck="false" autocapitalize="off" autocomplete="off">
        <span class="cursor" aria-hidden="true"></span>
      </form>
    </section>
  </main>
  <script>
    (() => {
      const commands = [
        ['about', 'a little about me'],
        ['stack', 'tools I like to use'],
        ['projects', 'selected work & experiments'],
        ['notes', 'small things on my mind'],
        ['contact', 'how to say hello'],
        ['help', 'show the command list'],
        ['clear', 'wipe the screen']
      ];
      const content = {
        about: [
          'I’m Your Name, a [your role] who enjoys turning curious ideas into useful, thoughtful digital things.',
          'I care about clear communication, kind collaboration, and craft at every scale.',
          'This is sample bio copy—replace it with your own story, interests, and location.'
        ],
        stack: [
          'A few tools in my orbit:',
          '  [language / framework]   building blocks',
          '  [design tool]            sketches & systems',
          '  [favorite tool]          whatever helps the idea',
          'Sample stack—swap in tools you actually use.'
        ],
        projects: [
          'A few sample projects:',
          '  Field Notes    / a calmer way to collect observations',
          '  Soft Signals   / a warm identity for community radio',
          '  Common Ground  / a friendly neighborhood resource',
          'These are placeholders. Add your real work and links here.'
        ],
        notes: [
          'A few open tabs in my brain:',
          '  Make useful things.',
          '  Stay a little curious.',
          '  Leave room for play.',
          'Sample notes—make these yours.'
        ],
        contact: [
          'I’d love to hear what you’re making.',
          'Replace this line with your real email address or preferred contact details.',
          'No contact address or external link is active in this demo.'
        ]
      };
      const transcript = document.querySelector('#transcript');
      const form = document.querySelector('#command-form');
      const input = document.querySelector('#command-input');
      const menu = document.querySelector('#help-menu');
      let history = [];
      let historyIndex = 0;

      function addLine(text, className = 'output-line') {
        const line = document.createElement('p');
        line.className = className;
        line.textContent = text;
        transcript.append(line);
      }
      function renderMenu() {
        const list = document.createElement('div');
        list.className = 'menu';
        list.setAttribute('aria-label', 'Available commands');
        const heading = document.createElement('p');
        heading.className = 'menu-heading';
        heading.textContent = 'Commands';
        list.append(heading);
        commands.forEach(([name, description]) => {
          const row = document.createElement('button');
          row.type = 'button';
          row.className = 'command-row';
          row.setAttribute('aria-label', `${name} — ${description}`);
          const command = document.createElement('span');
          command.className = 'command-name';
          command.textContent = name;
          const leader = document.createElement('span');
          leader.className = 'leader';
          leader.setAttribute('aria-hidden', 'true');
          const detail = document.createElement('span');
          detail.className = 'command-description';
          detail.textContent = description;
          row.append(command, leader, detail);
          row.addEventListener('click', () => runCommand(name));
          list.append(row);
        });
        return list;
      }
      function showHelp() {
        addLine('Available commands:', 'output-line output-heading');
        transcript.append(renderMenu());
        addLine('Pick a command above or type it at the prompt.', 'output-line output-muted');
      }
      function runCommand(raw) {
        const command = raw.trim().toLowerCase();
        if (!command) return;
        addLine(raw.trim(), 'output-line command-echo');
        if (command === 'clear') {
          transcript.replaceChildren();
          transcript.parentElement.scrollTop = 0;
          input.focus({ preventScroll: true });
          return;
        }
        if (command === 'help') {
          showHelp();
        } else if (Object.prototype.hasOwnProperty.call(content, command)) {
          content[command].forEach((line, index) => {
            addLine(line, index === 0 ? 'output-line output-heading' : 'output-line');
          });
        } else {
          addLine(`command not found: ${raw.trim()}. Type help to see available commands.`);
        }
        const screen = transcript.parentElement;
        screen.scrollTop = screen.scrollHeight;
        input.focus({ preventScroll: true });
      }
      form.addEventListener('submit', event => {
        event.preventDefault();
        const raw = input.value;
        const normalized = raw.trim().toLowerCase();
        if (!normalized) return;
        if (history[history.length - 1] !== raw.trim()) history.push(raw.trim());
        historyIndex = history.length;
        input.value = '';
        runCommand(raw);
      });
      input.addEventListener('keydown', event => {
        if (event.key === 'ArrowUp') {
          event.preventDefault();
          if (history.length) {
            historyIndex = Math.max(0, historyIndex - 1);
            input.value = history[historyIndex];
            input.setSelectionRange(input.value.length, input.value.length);
          }
        } else if (event.key === 'ArrowDown') {
          event.preventDefault();
          if (history.length) {
            historyIndex = Math.min(history.length, historyIndex + 1);
            input.value = historyIndex === history.length ? '' : history[historyIndex];
            input.setSelectionRange(input.value.length, input.value.length);
          }
        }
      });
      menu.replaceWith(renderMenu());
    })();
  </script>
</body>
</html>
